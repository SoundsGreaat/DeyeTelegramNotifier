services:
  deye-monitor:
    build: .
    container_name: deye_monitor
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=deye_bot
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    container_name: deye_postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=deye_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

