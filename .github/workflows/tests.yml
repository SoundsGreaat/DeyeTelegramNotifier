name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.11 / PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: deye_test
          POSTGRES_PASSWORD: deye_test
          POSTGRES_DB: deye_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U deye_test -d deye_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit and PostgreSQL migration tests
        env:
          TEST_POSTGRES_DSN: postgresql+asyncpg://deye_test:deye_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/deye_test
        run: python -m unittest discover -s tests -v
